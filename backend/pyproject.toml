[project]
name = "vetfarmaco-rag-backend"
version = "0.1.0"
description = "Back-end FastAPI do TCC VetFarmaco RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.10",
    "tiktoken>=0.14.0",
    "pyyaml>=6.0.3",
    "google-genai<3.0.0",
    "pgvector>=0.5.0",
    "bm25s>=0.3.11",
    "nltk>=3.10.3",
    "ranx>=0.3.21",
    "sse-starlette>=3.5.0",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
