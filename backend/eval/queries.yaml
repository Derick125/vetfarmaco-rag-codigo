# eval/queries.yaml — perguntas para montar o gold set manualmente.
#
# Só o texto da pergunta, como o médico veterinário digitaria — sem
# chunk_id, sem julgamento de relevância. Quem decide relevância é você,
# não este arquivo nem o pipeline.
#
# Fluxo:
#   1. uv run python -m scripts.preparar_rotulacao
#      → gera um arquivo por query em backend/data/rotulacao/<slug>.md, com
#        os candidatos reunidos (busca semântica + BM25 + lexical direta).
#   2. Leia cada arquivo, chunk a chunk, e preencha a linha "RELEVANTES:"
#      no topo com os chunk_id que sustentam a resposta.
#   3. uv run python -m scripts.consolidar_qrels
#      → gera eval/qrels.yaml a partir do que foi preenchido.

