  # --- Fora do escopo do TCC (pequenos animais) — declaradas para permitir
  # que `etl/extract_bula.py` reconheça (e exclua) ciclos de produto
  # veterinário de outras espécies em bulas multiespécie (ex.: RCM de UE
  # que descreve a mesma substância em várias apresentações, cada uma para
  # uma espécie-alvo diferente). Nunca usadas para indicar cobertura no
  # manifesto de bulas.
  - nome: bovino
    sinonimos:
      - bovino
      - bovina
      - bovinos
      - bovinas
      - boi
      - bois
      - vaca
      - vacas
      - gado

