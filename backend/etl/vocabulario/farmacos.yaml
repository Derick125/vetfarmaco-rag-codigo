# Dicionário controlado de fármacos e espécies (docs/RAG_SPEC.md §2,
# docs/PLANO_DE_FASES.md — Fase 1).
#
# `etl/chunk.py` casa o texto de cada chunk contra os sinônimos aqui
# listados; o valor gravado em `chunk.farmacos`/`chunk.especies`
# (docs/DATABASE.md §2) é sempre o `nome` canônico, nunca um sinônimo.
#
# Cobertura: os fármacos dos seis cenários do Quadro 2 do TCC (paracetamol,
# ivermectina, fenobarbital, carprofeno, tramadol, insulina NPH, meloxicam)
# mais os principais AINEs, opioides, antibióticos e antiparasitários de
# uso corrente em clínica de pequenos animais (cães e gatos). Não é
# exaustivo — é o vocabulário controlado inicial; cresce conforme o corpus
# indexado exigir (TCC §4.1b).

farmacos:
